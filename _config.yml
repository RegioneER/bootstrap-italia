# Dependencies
markdown: kramdown
highlighter: rouge
kramdown:
  auto_ids: true

permalink: pretty

source: '.'
destination: './_site'
encoding: UTF-8
exclude:
  - .git/
  - .github/
  - .idea/
  - src/
  - vendor
  - node_modules/
  - AUTHORS
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - yarn.lock
  - package.json
  - package-lock.json
  - README.md
  - gulpfile.js

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-toc

toc:
  max_level: 3

# Social
title: 'Bootstrap Italia Versione Obsoleta (1.6.4)'
description: 'La prima versione del framework ora è deprecata. Era basata su Bootstrap 4.6.1. Queste pagine sono il simulacro della vecchia documentazione.'
authors: 'Dipartimento per la Trasformazione Digitale'
