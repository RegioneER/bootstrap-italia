authors_agid: "Agenzia per l'Italia Digitale"
authors_agid_url: 'https://www.agid.gov.it/'
social_card_path: '/docs/assets/img/favicons/social-card.png'
social_logo_path: '/docs/assets/img/favicons/android-chrome-192x192.png'
repo: 'https://github.com/RegioneER/bootstrap-italia/'
